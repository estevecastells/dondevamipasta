# Cada lunes comprueba que los enlaces a las fuentes siguen vivos.
# También se puede lanzar a mano desde la pestaña Actions.
name: Enlaces de las fuentes

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enlaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run links
